<!DOCTYPE html>

<!-- aside section -->
       <div class="aside">

<i class="fa-solid fa-coins fa-xl" style="color: rgb(255, 255, 255);"></i>

        </div>

        <!-- links part -->
        <div class="links">
                <ul>
                    <li class="first-li">
                        <i class="fa-solid fa-house " style="color: rgb(62, 59, 225);"></i>

                    </li>
                                        <li class="box-hover">

                    </li>

                        <i class="fa-solid fa-file-invoice-dollar" style="color: rgb(106, 114, 130);"></i>

                </ul>
            </div>




            <div class="services">

                </div>
                <ul>

                    </li>
                    <li class="box-hover">

                    <li class="box-hover">

                    </li>
                    <li class="box-hover">
                        <div class="icon icon-clr4">
